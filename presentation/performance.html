<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #EAE8FD;
            color: #2D2861;
            font-family: Arial, sans-serif;
            padding-top: 62px;
            padding-left: 78px;
            padding-right: 78px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 22px;
            position: relative;
            overflow: hidden;
        }
        .slide-container:before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to right, transparent 0, transparent calc(8.333% - 1px), rgba(45, 40, 97, 0.15) calc(8.333% - 1px), rgba(45, 40, 97, 0.15) 8.333%);
            pointer-events: none;
        }
        h1 {
            grid-column: 1 / 13;
            font: 600 38px monospace;
            color: #1A1549;
            margin-bottom: 30px;
            position: relative;
        }
        .metrics-box {
            grid-column: 1 / 7;
            border: 2px solid #1A1549;
            padding-top: 24px;
            padding-left: 24px;
            padding-right: 24px;
            position: relative;
            background: rgba(255, 255, 255, 0.3);
        }
        .metrics-box h2 {
            font: 600 22px monospace;
            margin-bottom: 20px;
            color: #1A1549;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }
        th {
            text-align: left;
            font: 600 14px monospace;
            padding-top: 12px;
            border-bottom: 2px solid #1A1549;
            color: #1A1549;
        }
        td {
            padding-top: 12px;
            font-size: 18px;
            border-bottom: 1px solid rgba(45, 40, 97, 0.2);
        }
        .highlight-block {
            background: #1A1549;
            color: #FFD700;
            padding-top: 12px;
            padding-left: 16px;
            padding-right: 16px;
            font: 600 24px monospace;
            display: inline-block;
            margin-top: 10px;
        }
        .image-box {
            grid-column: 7 / 13;
            border: 2px solid #1A1549;
            padding-top: 20px;
            padding-left: 20px;
            padding-right: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #FFFFFF;
        }
        .image-box h2 {
            font: 600 20px monospace;
            margin-bottom: 16px;
            color: #1A1549;
            align-self: flex-start;
        }
        img {
            width: 500px;
            height: 375px;
            object-fit: contain;
            border: 1px solid #2D2861;
        }
        .footer-note {
            grid-column: 1 / 13;
            padding-top: 20px;
            font: 400 14px monospace;
            color: #2D2861;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <h1>04 / BENCHMARK PERFORMANCE</h1>
        
        <section class="metrics-box">
            <h2>CLASSIFICATION REPORT</h2>
            <table>
                <thead>
                    <tr>
                        <th>CLASS</th>
                        <th>PRECISION</th>
                        <th>RECALL</th>
                        <th>F1-SCORE</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Safe</td>
                        <td>0.98</td>
                        <td>0.95</td>
                        <td>0.97</td>
                    </tr>
                    <tr>
                        <td>Phishing</td>
                        <td>0.93</td>
                        <td>0.97</td>
                        <td>0.95</td>
                    </tr>
                </tbody>
            </table>
            <div style="padding-top: 10px;">
                <p style="font: 600 16px monospace;">OVERALL ACCURACY</p>
                <div class="highlight-block">96.25%</div>
            </div>
        </section>

        <section class="image-box">
            <h2>CONFUSION MATRIX</h2>
            <img src="/home/ubuntu/phishing_email_detector/artifacts/confusion_matrix.png" alt="Confusion Matrix">
            <p style="padding-top: 12px; font: 400 13px monospace; color: #2D2861;">TN: 461 | FP: 22 | FN: 8 | TP: 309</p>
        </section>

        <div class="footer-note">
            TEST SAMPLES: 800 (HELD-OUT) • STRATIFIED 80/20 SPLIT • BALANCED LOGISTIC REGRESSION
        </div>
    </div>
</body>
</html>
